name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit_test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.0'
          bundler-cache: true
      - name: Run RSpec
        run: |
          mkdir -p test-results/rspec
          bundle exec rspec --format progress --format RspecJunitFormatter --out test-results/rspec/results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rspec-results
          path: |
            test-results
            coverage
          if-no-files-found: ignore

  static_code_analysis:
    name: Static code analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.0'
          bundler-cache: true
      - name: Run RuboCop on changed Ruby files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
            git fetch --no-tags origin master
            base_sha="$(git merge-base origin/master HEAD)"
          else
            base_sha="$PUSH_BEFORE"
          fi

          mapfile -t ruby_files < <(git diff --name-only "$base_sha...HEAD" -- '*.rb')
          if ((${#ruby_files[@]} == 0)); then
            echo "No changed Ruby files to lint."
            exit 0
          fi

          bundle exec rubocop -f html --out report.html "${ruby_files[@]}"
      - name: Upload RuboCop report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rubocop-report
          path: report.html
          if-no-files-found: ignore

  system_test:
    name: System tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start system test services
        run: docker compose -f docker-compose.system-test.yml up -d --build
      - name: Run Bats tests
        shell: bash
        run: |
          while IFS= read -r -d '' test_file; do
            docker exec bucky-core bats "/bucky-core/${test_file}"
          done < <(find system_testing/testing_code -type f -name '*.bats' -print0)
      - name: Stop system test services
        if: always()
        run: docker compose -f docker-compose.system-test.yml down
